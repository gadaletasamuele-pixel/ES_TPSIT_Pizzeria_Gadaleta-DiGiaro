<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Menu Dolci</title>
    <style>
        body { font-family: sans-serif; background: #fff8f0; padding: 20px; text-align: center; }
        .card { background: white; margin: 15px auto; padding: 15px; max-width: 300px; border-radius: 8px; border: 1px solid #ddd; }
        img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        h3 { margin: 10px 0 5px; color: #4a2c2a; }
        p { color: #666; font-size: 14px; margin: 5px 0; }
        .prezzo { font-weight: bold; color: #b85b34; }
    </style>
</head>
<body>

    <h1>Menu dei Dolci</h1>

    <div class="card">
        <img src="dolce1.webp" alt="Tiramisù">
        <h3>Tiramisù Classico</h3>
        <p>Savoiardi, caffè e crema al mascarpone</p>
        <p class="prezzo">€ 6,50</p>
    </div>

    <div class="card">
        <img src="dolce2.jpg" alt="Tortino">
        <h3>Tortino al Cioccolato</h3>
        <p>Cuore caldo al cioccolato e frutti di bosco</p>
        <p class="prezzo">€ 7,00</p>
    </div>

    <div class="card">
        <img src="dolce3.webp" alt="Cheesecake">
        <h3>Cheesecake ai Lamponi</h3>
        <p>Biscotto, crema e lamponi freschi</p>
        <p class="prezzo">€ 6,00</p>
    </div>

</body>
</html>
